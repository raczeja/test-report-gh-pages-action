name: Stage test report for GitHub Pages
description: Assemble a GitHub Pages site, preserve reports and coverage, and stage static test reports.
inputs:
  report-directory:
    description: Directory containing the generated static HTML report (must contain index.html).
    required: false
    default: downloaded-report
  site-directory:
    description: Existing Pages site directory.
    required: false
    default: site
  existing-site-directory:
    description: Directory containing the currently published Pages site to preserve and update.
    required: false
    default: gh-pages-current
  coverage-directory:
    description: Directory containing coverage-summary.json from the coverage job.
    required: false
    default: downloaded-coverage
  report-type:
    description: Human-readable report format label (for example Playwright or Allure).
    required: false
    default: Playwright
  destination:
    description: Relative path within the site directory where the current report is staged.
    required: false
    default: ""
  run-number:
    description: CI run identifier used by the report index.
    required: false
    default: ""
  run-url:
    description: URL of the CI run.
    required: false
    default: ""
  max-reports:
    description: Maximum indexed reports to retain; 0 means no count-based pruning.
    required: false
    default: "0"
  max-report-size-mb:
    description: Maximum source report size in MiB; 0 means no per-report size limit.
    required: false
    default: "1000"
  max-site-size-bytes:
    description: Maximum total Pages site size; oldest run reports are pruned above this limit.
    required: false
    default: "1000000000"
outputs:
  report-path:
    description: Absolute path of the staged report directory.
  report-url-path:
    description: Relative URL path of the staged report directory.
  published:
    description: Whether a report directory was staged.
runs:
  using: composite
  steps:
    - name: Assemble Pages site
      shell: bash
      env:
        SITE_DIR: ${{ inputs.site-directory }}
        EXISTING_SITE_DIR: ${{ inputs.existing-site-directory }}
        REPORT_DIR: ${{ inputs.report-directory }}
        COVERAGE_DIR: ${{ inputs.coverage-directory }}
        PAGES_SIZE_LIMIT_BYTES: ${{ inputs.max-site-size-bytes }}
        MAX_REPORT_SIZE_MB: ${{ inputs.max-report-size-mb }}
        GITHUB_RUN_NUMBER: ${{ inputs.run-number || github.run_number }}
        GITHUB_RUN_URL: ${{ inputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
        GITHUB_SHA_VALUE: ${{ github.sha }}
      run: bash "${{ github.action_path }}/src/assemble-pages-site.sh"
    - name: Stage static report
      shell: bash
      env:
        INPUT_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        INPUT_SITE_DIRECTORY: ${{ inputs.site-directory }}
        INPUT_REPORT_TYPE: ${{ inputs.report-type }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_RUN_NUMBER: ${{ inputs.run-number }}
        INPUT_RUN_URL: ${{ inputs.run-url }}
        INPUT_MAX_REPORTS: ${{ inputs.max-reports }}
        INPUT_MAX_REPORT_SIZE_MB: ${{ inputs.max-report-size-mb }}
      run: python3 "${{ github.action_path }}/src/main.py"
